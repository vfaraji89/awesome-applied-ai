<!doctype html><html><head><meta charset="utf-8">
<!-- Brand kit source for awesome-applied-ai. Render a piece with ?k=<name> at its exact size. -->
<style>
@font-face{font-family:"Vahid Sora";src:url("../web/src/app/fonts/VahidSora-Regular.woff2");font-weight:400}
@font-face{font-family:"Vahid Sora";src:url("../web/src/app/fonts/VahidSora-SemiBold.woff2");font-weight:600}
@font-face{font-family:"Vahid Sora";src:url("../web/src/app/fonts/VahidSora-Bold.woff2");font-weight:700}
@font-face{font-family:"Vahid Sora";src:url("../web/src/app/fonts/VahidSora-ExtraBold.woff2");font-weight:800}
@font-face{font-family:"Geist Mono";src:url("../web/src/app/fonts/GeistMono-Variable.woff2");font-weight:100 900}
:root{--ink:#1c1c1e;--red:#e0301e;--deep:#b4200f;--mark:#ffdcd6;--paper:#fff6f4;--sec:#55555a;--muted:#8a8a90}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
.c{position:relative;overflow:hidden;background:var(--paper);font-family:"Vahid Sora",sans-serif;color:var(--ink)}
.c.dots::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(28,28,30,.07) 1.2px,transparent 1.4px);background-size:22px 22px}
.c.ink{background:#141312;color:#f4efe9}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.02em}
.brand b{color:var(--red)}
.k{font-family:"Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
.h{font-weight:800;letter-spacing:-.045em;line-height:1.02}
.h mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);color:inherit}
.dot{color:var(--red)}
.sub{color:var(--sec)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips span{font-family:"Geist Mono",monospace;font-size:15px;padding:7px 14px;border-radius:999px;border:1px solid rgba(28,28,30,.14);background:#fff;color:var(--sec)}
.chips span.on{border-color:var(--red);color:var(--deep)}
.url{font-family:"Geist Mono",monospace;color:var(--deep)}
.ab{position:absolute}
.ab .post{position:absolute;top:0;bottom:0;width:22px;border-radius:999px;background:linear-gradient(90deg,#b48a5c 0%,#d8bb94 24%,#f1e3cc 48%,#dcc29e 70%,#ad8455 100%);box-shadow:0 18px 26px -18px rgba(60,40,20,.55)}
.ab .rod{position:absolute;height:8px;border-radius:9px;background:linear-gradient(180deg,#e9d8bd,#f4eadb 35%,#d2b48d 75%,#b8946a)}
.ab .bead{position:absolute;border-radius:50%;box-shadow:inset -4px -5px 9px -4px rgba(0,0,0,.18),0 10px 14px -10px rgba(40,20,10,.5)}
.ab .w{background:radial-gradient(circle at 34% 28%,#fff,#f4f1ee 40%,#d9d3cd)}
.ab .r{background:radial-gradient(circle at 34% 28%,#ff8f80,#e0301e 42%,#9e1a0c)}
.ab .i{background:radial-gradient(circle at 34% 28%,#6a6a70,#1c1c1e 45%,#000)}
.sw{display:flex;flex-direction:column;gap:8px;font-family:"Geist Mono",monospace;font-size:14px;color:var(--sec)}
.sw i{display:block;width:150px;height:96px;border-radius:14px;border:1px solid rgba(28,28,30,.1)}
</style></head><body>
<div id="root"></div>
<script>
/* The Applied AI mark: the harness (the frame), the model inside it (the red bead), and a tool call (one line out through the wall to a tool). */
let G=0;
const MARK=(s,ink='#1c1c1e',bg='#fff6f4')=>{const id='bd'+(G++);return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><defs><radialGradient id="${id}" cx=".34" cy=".3" r=".75"><stop offset="0" stop-color="#ff9d8f"/><stop offset=".45" stop-color="#e0301e"/><stop offset="1" stop-color="#9e1a0c"/></radialGradient></defs><rect x="1.6" y="3.6" width="15.4" height="16.8" rx="4.6" fill="${bg}" stroke="${ink}" stroke-width="1.8"/><path d="M12.4 12h7.4" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/><rect x="19.2" y="9.6" width="4.2" height="4.8" rx="1.3" fill="${ink}"/><circle cx="9.3" cy="12" r="3.3" fill="url(#${id})"/></svg>`};
const WORD=(fs,ink='var(--ink)')=>`<span style="font-weight:800;letter-spacing:-.035em;font-size:${fs}px;color:${ink}">Applied AI<b style="color:var(--red)">.</b></span>`;
function abacus(x,y,w,h,rows,bead){
  const n=rows.length, post=22, gap=h/(n+1);
  let html=`<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="post" style="left:0"></div><div class="post" style="right:0"></div>`;
  rows.forEach((row,ri)=>{
    const cy=gap*(ri+1);
    html+=`<div class="rod" style="left:${post}px;right:${post}px;top:${cy-4}px"></div>`;
    const L=row.filter(b=>b[1]==='L'), R=row.filter(b=>b[1]==='R');
    L.forEach((b,k)=>{html+=`<div class="bead ${b[0]}" style="width:${bead}px;height:${bead}px;left:${post+4+k*(bead+2)}px;top:${cy-bead/2}px"></div>`});
    R.forEach((b,k)=>{html+=`<div class="bead ${b[0]}" style="width:${bead}px;height:${bead}px;left:${w-post-4-(R.length-k)*(bead+2)+2}px;top:${cy-bead/2}px"></div>`});
  });
  return html+`</div>`;
}
/* the climbing pattern, as a full abacus: ink low, then the red bead on top */
const CLIMB=[[['w','L'],['r','L'],['r','L'],['r','L'],['w','R']],[['w','L'],['i','L'],['i','L'],['w','R'],['w','R']],[['i','L'],['w','R'],['w','R'],['w','R'],['w','R']]];
const BRAND=(fs,ms)=>`<div class="brand" style="font-size:${fs}px">${MARK(ms)}<span>Applied AI<b>.</b></span><span class="k" style="font-size:${Math.round(fs*.55)}px;margin-left:8px">awesome-applied-ai</span></div>`;
const K={
mark:{w:512,h:512,bg:'transparent',html:`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${MARK(440)}</div>`},
'mark-dark':{w:512,h:512,cls:'ink',html:`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${MARK(360,'#f4efe9','#141312')}</div>`},
favicon:{w:64,h:64,bg:'transparent',html:`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${MARK(62)}</div>`},
icon:{w:180,h:180,html:`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${MARK(150)}</div>`},
lockup:{w:1200,h:300,html:`<div style="position:absolute;inset:0;display:flex;align-items:center;gap:34px;padding:0 90px">${MARK(150)}<div>${WORD(112)}<div class="k" style="font-size:22px;margin-top:10px">awesome-applied-ai · curated by Vahid Faraji</div></div></div>`},
'social-preview':{w:1280,h:640,cls:'dots',html:`
  <div style="position:absolute;left:80px;top:78px;width:720px">
    ${BRAND(30,40)}
    <div class="h" style="font-size:88px;margin-top:46px">Applied AI,<br><mark>mapped</mark><span class="dot">.</span></div>
    <div class="sub" style="font-size:26px;margin-top:24px;line-height:1.4">Free animated courses, the jargon, the architecture,<br>the tools, the roles and the market, in plain words.</div>
    <div class="chips" style="margin-top:34px"><span class="on">Claude Code</span><span class="on">Claude Platform</span><span class="on">LangChain · Deep Agents</span><span class="on">Vercel AI SDK</span></div>
  </div>
  ${abacus(880,120,320,380,CLIMB,52)}
  <div class="url" style="position:absolute;right:80px;bottom:44px;font-size:18px">vfaraji89.github.io/awesome-applied-ai</div>`},
og:{w:1200,h:630,cls:'dots',html:`
  <div style="position:absolute;left:76px;top:80px;width:700px">
    ${BRAND(28,38)}
    <div class="k" style="font-size:18px;margin-top:46px">Free courses · open to everyone</div>
    <div class="h" style="font-size:84px;margin-top:14px">Learn applied AI,<br>one <mark>animation</mark> at a time<span class="dot">.</span></div>
  </div>
  ${abacus(830,130,300,360,CLIMB,48)}
  <div class="url" style="position:absolute;left:76px;bottom:52px;font-size:18px">vfaraji89.github.io/awesome-applied-ai</div>`},
linkedin:{w:1584,h:396,cls:'dots',html:`
  <div style="position:absolute;left:440px;top:60px;width:780px">
    ${BRAND(26,34)}
    <div class="h" style="font-size:62px;margin-top:26px">Applied AI, <mark>mapped</mark> and taught<span class="dot">.</span></div>
    <div class="sub" style="font-size:22px;margin-top:16px">Claude Code · Claude Platform · LangChain & Deep Agents · Vercel AI SDK</div>
  </div>
  ${abacus(1260,56,270,256,CLIMB,40)}
  <div class="url" style="position:absolute;right:64px;bottom:30px;font-size:16px">vfaraji89.github.io/awesome-applied-ai</div>`},
'linkedin-min':{w:1584,h:396,html:`
  <div style="position:absolute;left:470px;top:104px;width:760px">
    <div class="k" style="font-size:15px">awesome-applied-ai</div>
    <div class="h" style="font-size:64px;margin-top:16px;white-space:nowrap">Applied AI, <mark>mapped</mark><span class="dot">.</span></div>
    <div style="display:flex;gap:7px;align-items:center;margin-top:28px;font-family:'Geist Mono';font-size:13px;color:var(--sec);white-space:nowrap">
      ${['Market','Roles & skills','AI-native architect','Certificates','Docs','Contribute'].map((t,i)=>`<span style="display:flex;align-items:center;gap:7px"><b style="color:${i===0?'var(--red)':'var(--muted)'};font-weight:500">0${i+1}</b>${t}</span>`).join('<span style="color:var(--muted)">·</span>')}
    </div>
  </div>
  <div style="position:absolute;right:110px;top:84px;width:300px;height:240px;transform:scale(.78);transform-origin:right top">
    <div style="position:absolute;left:0;top:0;width:200px;height:240px;border:7px solid var(--ink);border-radius:52px;background:#fff"></div>
    <div style="position:absolute;left:198px;top:116px;width:66px;height:7px;border-radius:4px;background:var(--ink)"></div>
    <div style="position:absolute;left:254px;top:90px;width:46px;height:60px;border-radius:14px;background:var(--ink)"></div>
    <div style="position:absolute;left:58px;top:78px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ff9d8f,#e0301e 45%,#9e1a0c);box-shadow:0 18px 26px -14px rgba(158,26,12,.55)"></div>
  </div>
  <div class="url" style="position:absolute;right:96px;bottom:34px;font-size:15px">vfaraji89.github.io/awesome-applied-ai</div>`},
x:{w:1500,h:500,cls:'dots',html:`
  <div style="position:absolute;left:420px;top:112px;width:720px">
    <div class="k" style="font-size:17px">awesome-applied-ai · free courses</div>
    <div class="h" style="font-size:80px;margin-top:18px">Applied AI,<br>in <mark>plain words</mark><span class="dot">.</span></div>
    <div class="sub" style="font-size:23px;margin-top:20px">One idea, one comparison, one animation at a time.</div>
  </div>
  ${abacus(1160,110,280,280,CLIMB,40)}
  <div class="url" style="position:absolute;right:60px;bottom:34px;font-size:17px">vfaraji89.github.io/awesome-applied-ai</div>`},
sheet:{w:1600,h:800,html:`
  <div style="position:absolute;left:80px;top:70px;right:80px">
    <div class="k" style="font-size:18px">Brand kit · awesome-applied-ai</div>
    <div style="display:flex;align-items:center;gap:40px;margin-top:30px">${MARK(180)}${MARK(180,'#f4efe9','#141312')}<div>${WORD(96)}<div class="sub" style="font-size:22px;margin-top:12px;max-width:600px">The frame is the harness, the red bead is the model inside it, and one line out through the wall is a tool call. Nothing else.</div></div></div>
    <div style="display:flex;gap:22px;margin-top:56px">
      <div class="sw"><i style="background:#fff6f4"></i>Paper #fff6f4</div>
      <div class="sw"><i style="background:#1c1c1e"></i>Ink #1c1c1e</div>
      <div class="sw"><i style="background:#e0301e"></i>Rust #e0301e</div>
      <div class="sw"><i style="background:#b4200f"></i>Rust deep #b4200f</div>
      <div class="sw"><i style="background:#ffdcd6"></i>Highlight #ffdcd6</div>
      <div class="sw"><i style="background:#55555a"></i>Secondary #55555a</div>
      <div class="sw"><i style="background:linear-gradient(90deg,#b48a5c,#d8bb94 24%,#f1e3cc 48%,#dcc29e 70%,#ad8455)"></i>Dowel (wood)</div>
    </div>
    <div style="display:flex;gap:70px;margin-top:56px;align-items:flex-end">
      <div><div class="k" style="font-size:15px">Headings · Vahid Sora 800</div><div class="h" style="font-size:64px;margin-top:10px">Learn the <mark>tools</mark><span class="dot">.</span></div></div>
      <div><div class="k" style="font-size:15px">Labels · Geist Mono</div><div style="font-family:'Geist Mono';font-size:24px;margin-top:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep)">Lesson 04 of 08</div></div>
      <div><div class="k" style="font-size:15px">Body · Vahid Sora 400</div><div class="sub" style="font-size:22px;margin-top:14px;max-width:360px">Plain words, one everyday comparison, one short animation.</div></div>
    </div>
  </div>
  ${abacus(1310,470,240,280,CLIMB,36)}`},
};
const k=new URLSearchParams(location.search).get('k'); const d=K[k];
document.getElementById('root').innerHTML=`<div class="c ${d.cls||''}" style="width:${d.w}px;height:${d.h}px;${d.bg?'background:'+d.bg:''}">${d.html}</div>`;
</script></body></html>
