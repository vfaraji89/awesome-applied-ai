name: Sync content from the Google Sheet

# The content sheet is where the radar, tools, jargon and the tracker's company list are
# edited (see CONTENT.md). This reads it, validates every row, runs the site's own checks
# (types and every internal link), and opens a pull request with the changes. Nothing
# reaches the site until that pull request is merged.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"   # daily, before the job-market tracker

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTENT_SHEET_ID: ${{ secrets.CONTENT_SHEET_ID }}
      BRANCH: content/sheet-sync
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4

      - name: Read and validate the sheet
        id: pull
        run: |
          if [ -z "$CONTENT_SHEET_ID" ]; then
            echo "::notice::CONTENT_SHEET_ID is not set; add it under Settings > Secrets and variables > Actions."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bun scripts/content.ts pull
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "The sheet matches the repository."
          else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --stat; fi

      - name: Run the site's checks on the new content
        if: steps.pull.outputs.changed == 'true'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Secret scan
        if: steps.pull.outputs.changed == 'true'
        run: node scripts/secret-scan.mjs

      - name: Open or update the pull request
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "content-sync"
          git config user.email "content-sync@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pipeline/companies.json web/src/data/content
          git commit -m "Content: sync from the Google Sheet ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          summary=$(git diff --stat HEAD~1 HEAD | tail -1)
          body="Synced from the content sheet by the [content-sync workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Every row passed validation and the site's typecheck and link checks.

          ${summary}

          Review the diff, then merge to publish."
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "Content: sync from the Google Sheet" --body "$body"
          fi
