name: Watch the docs' sources

# Once a month: checks the sources each doc is written from (the MCP specification and SDKs, the
# Claude API overview, DataHub releases). Records what it finds in web/src/data/doc-sources.json
# (shown on each doc as "checked on") and, when a source changed, opens one issue saying which doc
# to review. It never rewrites a doc. On a branch push it only does a dry run.
on:
  schedule:
    - cron: "41 6 2 * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["pipeline/docs-watch.ts", "web/src/data/doc-sources.json", ".github/workflows/docs-watch.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: docs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Dry run on a branch
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun pipeline/docs-watch.ts --dry
      - name: Check the sources
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun pipeline/docs-watch.ts
      - name: Commit what was found
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "docs-watch"
          git config user.email "docs-watch@users.noreply.github.com"
          git add web/src/data/doc-sources.json pipeline/doc-snapshots.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Docs watch: $(date -u +%Y-%m-%d) check"
          git pull --rebase origin main
          git push
