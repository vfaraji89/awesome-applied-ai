name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "system-design.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # the market tracker commits with the workflow token, which does not trigger push workflows
  workflow_run:
    workflows: ["Track job market", "Find new tools"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing: a cancelled run can leave a
# Pages deployment half-open, and the next one then queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://vfaraji89.github.io/${{ github.event.repository.name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

  # Tell IndexNow engines (Bing, which feeds Copilot and ChatGPT search, plus Yandex, Seznam, Naver)
  # which pages changed, right after each deploy instead of waiting for the portfolio's weekly ping.
  # The key is public by design: the portfolio serves it at the host root, which proves the host is ours.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow with this site's sitemap
        env:
          KEY: "499c30459ae68ddbeabb51eca981bf84"
        run: |
          set -euo pipefail
          sleep 30
          urls=$(curl -fsS "https://vfaraji89.github.io/${{ github.event.repository.name }}/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sort -u)
          n=$(printf '%s\n' "$urls" | grep -c . || true)
          body=$(printf '%s\n' "$urls" | jq -R . | jq -s --arg k "$KEY" '{host: "vfaraji89.github.io", key: $k, keyLocation: ("https://vfaraji89.github.io/" + $k + ".txt"), urlList: .}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow: $n URLs, HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered $code" ;; esac
