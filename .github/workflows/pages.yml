name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "system-design.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # the market tracker commits with the workflow token, which does not trigger push workflows
  workflow_run:
    workflows: ["Track job market"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing: a cancelled run can leave a
# Pages deployment half-open, and the next one then queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /awesome-applied-ai
          NEXT_PUBLIC_SITE_URL: https://vfaraji89.github.io/awesome-applied-ai
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
