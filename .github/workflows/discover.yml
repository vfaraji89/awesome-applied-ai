name: Find new tools

# Every Monday: refreshes the GitHub stars behind the map's Popular, Trending and New badges,
# then looks for tools the map does not list yet (new and rising open-source repos per
# area, well-known repos still missing, notable Show HN launches, tools job posts ask for) and
# opens one issue with the candidates, each as a row ready for the content sheet. The first run
# of each month also checks the map's GitHub-hosted tools for archived or quiet repos.
# Nothing is added to the site automatically: a person checks each candidate and adds it in the
# content sheet, which goes through the usual validation and pull request.
# On a branch push it only does a dry run and prints the report in the job summary.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["pipeline/discover.ts", "pipeline/github-stats.ts", ".github/workflows/discover.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Dry run on a branch (reports, writes nothing)
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun pipeline/github-stats.ts --dry | tee -a "$GITHUB_STEP_SUMMARY"
          bun pipeline/discover.ts --dry --areas=retrieval,landscape | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Refresh GitHub stars for the map (popular, trending, new)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun pipeline/github-stats.ts
      - name: Find candidates
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun pipeline/discover.ts
      - name: Open this week's issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="$(head -1 tool-candidates.md | sed 's/^# //')"
          gh label create tool-candidates --color E0301E --description "Weekly tool discovery" 2>/dev/null || true
          existing="$(gh issue list --label tool-candidates --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue edit "$existing" --body-file tool-candidates.md
          else gh issue create --title "$title" --label tool-candidates --body-file tool-candidates.md; fi
      - name: Remember what was proposed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "tool-discovery"
          git config user.email "tool-discovery@users.noreply.github.com"
          git add market/tool-candidates.json web/src/data/github-stats.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Tools: GitHub stars and candidates for $(date -u +%G-W%V)"
          git pull --rebase origin main
          git push
