name: Probe conference data

# One-off: prints what conference sites publish in machine-readable form, to the job log only.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["pipeline/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Probe
        env:
          PROBE_URLS: >-
            https://ai.engineer/data.md
            https://ai.engineer/code/2026/organization-affiliations.json
            https://ai.engineer/europe/2026/sessions.json
            https://ai.engineer/code/2026/sessions.json
            https://pytorchconferenceeu2026.sched.com/all.ics
            https://pytorchconference2026.sched.com/all.ics
            https://pytorch2026.sched.com/all.ics
            https://build.microsoft.com/api/session/all/en-US
            https://raysummit.anyscale.com/llms.txt
            https://io.google/llms.txt
        run: bun pipeline/probe/conferences.ts
