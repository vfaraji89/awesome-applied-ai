name: Probe conference data

# One-off: prints what conference sites publish in machine-readable form, to the job log only.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["pipeline/probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.4
      - name: Probe
        env:
          PROBE_URLS: >-
            https://ai.engineer/data.md
            https://ai.engineer/api/data/talks?format=json
            https://ai.engineer/api/data/speakers?format=json
            https://ai.engineer/api/data/topics?format=json
            https://ai.engineer/api/data/organizations?format=json
            https://ai.engineer/terms
            https://pytorchconference.sched.com/all.ics
            https://pytorchconferencena2026.sched.com/all.ics
        run: bun pipeline/probe/conferences.ts
